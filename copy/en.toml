[product.agents]
title = "AI assistant · MIAO"
meta = "MIAO's assistant helps you build apps and handle daily work, with confirmation for important actions and permissions that never overstep."
kicker = "AI ASSISTANT · WORK CAPABILITIES"
h1_line1 = "One assistant,"
h1_line2 = "for building and using apps."
lede1 = "Tell MIAO what you want to do. It can help you create apps, view data you are allowed to access, "
lede2 = "and complete business actions with your confirmation."
lede3 = ""
tag_demo = "Illustrative / demo"
tag_note = " Model names, records and receipts on this page are illustrative, not production capability or real customer data."

[product.agents.build]
kicker = "BUILD FROM A NEED"
title = "Describe your need, and building begins."
card1_title = "Ask"
card1_body = "For example: “Build me a customer follow-up app with customers, owners and follow-up status.”"
card2_title = "Review the structure"
card2_body = "Data tables, pages and actions appear as drafts first; nothing is written until you confirm."
card3_title = "Confirm and publish"
card3_body = "Publish when it fits, and the team can start entering and using it."
note = "This building flow is illustrative; the published interface is the source of truth."

[product.agents.tasks]
kicker = "DAILY WORK"
title = "Once built, it can also help with the work."
card1_title = "Find customer records"
card1_body = "Within your authorization, find matching customers and follow-up records and view results quickly."
card2_title = "Update follow-up status"
card2_body = "Change “in conversation” to “closed”. Writes check your permissions and leave a record."
card3_title = "Organize public sources"
card3_body = "Read permitted public sources under declarative rules and prepare drafts; publishing still needs confirmation."

[product.agents.confirm]
kicker = "YOUR CONTROL"
title = "Important actions: see them first, then confirm."
body1 = "Actions that write, publish, notify or widen visibility show the change and its impact first, and wait for your confirmation or cancellation."
body2 = "Both confirmation and cancellation keep run records, so you can see who did what at each step."

[product.agents.boundary]
kicker = "PERMISSION BOUNDARIES"
title = "You stay in control; permissions never overstep."
body1 = "The assistant only works on apps and fields the current member is authorized to use, and never runs arbitrary shell, user code or unauthorized external access."
body2 = "Authorized background tasks may continue after the browser closes and keep an auditable receipt; they need separate authorization and not every action runs automatically."

