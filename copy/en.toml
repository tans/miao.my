must1_body = "A Linux or macOS x64/ARM64 host with PM2, curl and openssl. Running a released package does not need Go or Node.js."
must2_title = "Data directory and encryption key"
must2_body = "Data lives in the operator's data directory; you need a server encryption key and the first platform admin email."
must3_title = "Backup space"
must3_body = "Database and attachments need backup space, plus an operator responsible for regular backups, recovery drills and upgrades."
public_kicker = "When serving publicly"
public1_title = "Domain and HTTPS"
public1_body = "Serving publicly requires a domain and an HTTPS reverse proxy; the proxy owns HTTPS, domain and port boundaries."
model_kicker = "When you want AI building"
model1_title = "Model service configuration"
model1_body = "Conversational building and UI drafts need a model service provider, base_url and key (the key stays server-side)."
mail_kicker = "When you need email"
mail1_title = "Mail service"
mail1_body = "For sign-up verification or invitation emails, configure a Resend account and a verified sender domain."

[self-hosting.steps]
kicker = "THREE STEPS"
title = "Three steps to start your workbench."
step1_title = "Download the release"
step1_body = "Get the version package from GitHub Releases. You will see: release files with verifiable SHA-256."
step2_title = "Install and configure"
step2_body = "Run the install script, confirm the data directory, listen address, encryption key and first admin email, then configure sign-up, mail, AI and backup policy. You will see: the first admin account you can sign in to."
step3_title = "Sign in, verify and create an app"
step3_body = "Sign in, create the first workspace and app, and let the team start using it. You will see: a workbench the team can sign in to and enter business data."
finish_note = "The program starting and the health check passing does not mean public HTTPS, mail, model calls or business flows are validated; each needs separate confirmation in the target environment."

[self-hosting.data]
kicker = "YOUR DATA, YOUR CONTROL"
title = "Apps and data stay in your control."
point1_title = "Single-process delivery"
point1_body = "One Go program contains the workbench, data service and migrations, run directly from the release package."
point2_title = "Data stays in your environment"
point2_body = "PocketBase/SQLite is embedded; the data directory and backups are operator-owned, and permission checks run server-side."
