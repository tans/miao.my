<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MIAO 是开源的企业 AI 工作台，帮助团队管理内部应用和业务数据，并用 AI 助手整理日常工作。" />
  <meta name="theme-color" content="#ffffff" />
  <title>MIAO｜开源的企业 AI 工作台</title>
  <link rel="icon" type="image/png" href="/assets/mascots/cat-logo-head.png" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="navbar site-nav">
    <div class="navbar-start"><a class="brand" href="/" aria-label="MIAO 首页"><img src="/assets/mascots/cat-logo-head.png" alt="" /><strong>MIAO</strong></a></div>
    <nav class="navbar-end" aria-label="主导航"><a class="nav-link" href="/docs/">文档</a><a class="btn btn-neutral btn-sm nav-github" href="https://github.com/tans/miao">GitHub ↗</a></nav>
  </header>
  <main class="landing-home">
    <section class="home-hero home-hero-compact" aria-labelledby="hero-title">
      <h1 id="hero-title">5 分钟，搭建自己的<br /><span class="rotating-product" id="rotating-product" aria-live="polite">CRM</span> 系统</h1>
      <p class="hero-subtitle">开源的企业 AI 工作台</p>
      <div class="hero-visual">
        <div class="miao-cat-track" aria-hidden="true">
          <svg class="miao-walking-cat" viewBox="0 0 64 44" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <g class="miao-cat-tail"><path d="M47 23C55 21 60 16 59 10c-.4-3-2.5-4.2-4.6-2.4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></g>
            <g class="miao-cat-legs-back" fill="currentColor">
              <path d="m27 27-3 6-3 4 1 2h7l1.5-2-2-3 4-6z"/>
              <path d="m38 27 3 6-.5 4 1.5 2h6l1-2-4-3-1-7z"/>
            </g>
            <g class="miao-cat-body">
              <ellipse cx="36" cy="23" rx="15" ry="8.5" fill="currentColor"/>
              <path d="M11 17c0-4.2 2.5-7.2 6-7.8L19 4l4 6 2.2 1.2c2.4 1.4 3.7 4.4 3 7.5l-1 3.6H13c-1.2-1.2-2-2.7-2-4.3Z" fill="currentColor"/>
              <circle cx="14.2" cy="15.2" r="1" fill="#e5b93f"/>
              <circle cx="10.7" cy="18.4" r=".85" fill="#d98f93"/>
            </g>
            <g class="miao-cat-legs-front" fill="currentColor">
              <path d="m31 27 2 6-1 4 1.5 2h6l.8-2-4-3-1-7z"/>
              <path d="m43 27 2 6-2 4 1 2h7l1-2-4-3-1-7z"/>
            </g>
          </svg>
        </div>
        <img class="home-preview-image" src="/docs/prototypes/images/01-overview.png" alt="MIAO 工作台首页预览" />
      </div>
      <ul class="feature-list" aria-label="产品特性"><li>自定义应用</li><li>开源 · 免费商用</li><li>Agent Embed</li></ul>
      <button class="btn btn-neutral deploy-cta" id="contact-cta" type="button" aria-haspopup="dialog">定制部署，联系客服</button>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="/" aria-label="MIAO 首页"><img src="/assets/mascots/cat-logo-head.png" alt="" /><strong>MIAO</strong></a><nav aria-label="页脚导航"><a href="/docs/">文档</a><a href="https://github.com/tans/miao">GitHub ↗</a></nav></footer>
  <dialog class="modal contact-modal" id="wechat-dialog" aria-labelledby="wechat-title">
    <div class="modal-box">
      <h2 id="wechat-title">添加微信联系客服</h2>
      <p>微信号</p>
      <strong class="wechat-id">tianshe00</strong>
      <form method="dialog" class="modal-action"><button class="btn btn-neutral">知道了</button></form>
    </div>
    <form method="dialog" class="modal-backdrop"><button aria-label="关闭提示">关闭</button></form>
  </dialog>
  <script>
    document.getElementById('contact-cta').addEventListener('click', () => document.getElementById('wechat-dialog').showModal());
    const rotatingProduct = document.getElementById('rotating-product');
    const productTypes = ['CRM', 'GEO', '增长', '裂变', '营销自动化', '客户管理', '会员运营', '项目协作'];
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let productIndex = 0;
      window.setInterval(() => {
        rotatingProduct.classList.add('is-changing');
        window.setTimeout(() => {
          productIndex = (productIndex + 1) % productTypes.length;
          rotatingProduct.textContent = productTypes[productIndex];
          rotatingProduct.classList.remove('is-changing');
        }, 180);
      }, 2400);
    }
  </script>
</body>
</html>
