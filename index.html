<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MIAO 是开源的企业 AI 工作台，帮助团队管理内部应用和业务数据，并用 AI 助手整理日常工作。" />
  <meta name="theme-color" content="#ffffff" />
  <title>MIAO｜开源的企业 AI 工作台</title>
  <link rel="icon" type="image/png" href="/assets/mascots/cat-logo-head.png" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

<body>
  <header class="navbar site-nav">
    <div class="navbar-start"><a class="brand" href="/" aria-label="MIAO 首页"><img src="/assets/mascots/cat-logo-head.png" alt="" /><strong>miao.my</strong></a></div>
    <nav class="navbar-end" aria-label="主导航"><a class="nav-link" href="/docs/">文档</a><a class="btn btn-neutral btn-sm nav-github" href="https://github.com/tans/miao">GitHub ↗</a></nav>
  </header>
  <main class="landing-home">
    <section class="home-hero home-hero-compact" aria-labelledby="hero-title">
      <h1 id="hero-title">开源企业工作台</h1>
      <p class="hero-wordmark">build app fast and simple <span class="hero-wordmark-brand">- miao.my</span></p>
      <a class="btn btn-neutral deploy-cta" href="https://miao.minapp.xin">马上使用</a>
      <div class="hero-visual">
        <div class="miao-cat-track" aria-hidden="true">

            <g class="miao-cat-body"><ellipse cx="36" cy="23" rx="15" ry="8.5" fill="currentColor"/><path d="M11 17c0-4.2 2.5-7.2 6-7.8L19 4l4 6 2.2 1.2c2.4 1.4 3.7 4.4 3 7.5l-1 3.6H13c-1.2-1.2-2-2.7-2-4.3Z" fill="currentColor"/><circle cx="14.2" cy="15.2" r="1" fill="#e5b93f"/><circle cx="10.7" cy="18.4" r=".85" fill="#d98f93"/></g>
            <g class="miao-cat-legs-front"><g transform="translate(29 25)"><path class="miao-cat-leg miao-cat-leg-near-front" d="M0 0 Q1 6 -3 12 L-5 13" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(44 25)"><path class="miao-cat-leg miao-cat-leg-near-hind" d="M0 0 Q1 6 -3 12 L-5 13" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
          </svg>
        </div>

            <g class="miao-cat-body"><ellipse cx="36" cy="23" rx="15" ry="8.5" fill="currentColor"/><path d="M11 17c0-4.2 2.5-7.2 6-7.8L19 4l4 6 2.2 1.2c2.4 1.4 3.7 4.4 3 7.5l-1 3.6H13c-1.2-1.2-2-2.7-2-4.3Z" fill="currentColor"/><circle cx="14.2" cy="15.2" r="1" fill="#e5b93f"/><circle cx="10.7" cy="18.4" r=".85" fill="#d98f93"/></g>
            <g class="miao-cat-legs-front"><g transform="translate(29 25)"><path class="miao-cat-leg miao-cat-leg-near-front" d="M0 0 Q1 6 -3 12 L-5 13" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(44 25)"><path class="miao-cat-leg miao-cat-leg-near-hind" d="M0 0 Q1 6 -3 12 L-5 13" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
          </svg>

            <path class="miao-cat-seated-tail" d="M42 34C51 39 59 38 57 33c-1-3-5-2-6 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

            <circle cx="16" cy="13" r="1" fill="#e5b93f"/>
            <circle cx="13" cy="16" r=".8" fill="#d98f93"/>
          </svg>
        </div>
        </div>
        <figure class="home-preview-figure">
          <img class="home-preview-image" src="/docs/prototypes/images/01-overview.png" alt="MIAO 工作台首页设计稿：工作区导航、fx 对话输入与应用列表" />
          <figcaption class="home-preview-caption"><span>工作台首页</span></figcaption>
        </figure>
      </div>
      <ul class="feature-list" aria-label="产品特性"><li>简单快速</li><li>开源可商用</li><li>AI开箱即用</li></ul>
      <button class="btn btn-neutral deploy-cta" id="contact-cta" type="button" aria-haspopup="dialog">定制部署，联系客服</button>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="/" aria-label="MIAO 首页"><img src="/assets/mascots/cat-logo-head.png" alt="" /><strong>miao.my</strong></a><nav aria-label="页脚导航"><a href="/docs/">文档</a><a href="https://github.com/tans/miao">GitHub ↗</a></nav></footer>
  <dialog class="modal contact-modal" id="wechat-dialog" aria-labelledby="wechat-title">
    <div class="modal-box">
      <h2 id="wechat-title">添加微信联系客服</h2>
      <p>微信号</p>
      <strong class="wechat-id">tianshe00</strong>
      <form method="dialog" class="modal-action"><button class="btn btn-neutral">知道了</button></form>
    </div>
    <form method="dialog" class="modal-backdrop"><button aria-label="关闭提示">关闭</button></form>
  </dialog>
  <script>
    document.getElementById('contact-cta').addEventListener('click', () => document.getElementById('wechat-dialog').showModal());
    const solCat = document.querySelector('.miao-cat-sol');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      solCat.classList.add('is-sitting');
    } else {
      solCat.addEventListener('animationend', (event) => {
        if (event.target === solCat && event.animationName === 'miao-cat-sol-to-center') {
          solCat.classList.add('is-sitting');
        }
      });
    }
  </script>
</body>
</html>
